<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: url("{{ url_for('static', filename='images/intro.jpg')}}") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            min-height: 100vh;
            padding-right: 60px;
        }

        .card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 32px;
            width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            color: #1a237e;
            font-size: 22px;
            font-weight: 700;
        }

        .header p {
            color: #888;
            font-size: 13px;
            margin-top: 4px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            color: #1565c0;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .field select,
        .field input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            color: #222;
            outline: none;
            transition: border 0.2s;
        }

        .field select:focus,
        .field input:focus {
            border-color: #1565c0;
        }

        .btn-search {
            width: 100%;
            padding: 14px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .btn-search:hover {
            background: #0d47a1;
        }
    </style>
</head>
<body>

<div class="card">

    <div class="header">
        <h1>🚂 Train Search</h1>
    </div>

    {% if error %}
<div style="
    background: #fce4ec;
    color: #c62828;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;">
    {{ error }}
</div>
{% endif %}

<form action="/search" method="POST">

        <div class="field">
            <label>From</label>
            <select name="from_code" required>
                <option value="" disabled selected>Select departure station</option>
                {% for station in stations %}
                <option value="{{ station.station_code }}">
                    {{ station.station_code }} — {{ station.station_name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label>To</label>
            <select name="to_code" required>
                <option value="" disabled selected>Select arrival station</option>
                {% for station in stations %}
                <option value="{{ station.station_code }}">
                    {{ station.station_code }} — {{ station.station_name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label>Departure Date</label>
            <input type="date" name="departure_date" required>
        </div>

        <button type="submit" class="btn-search">Search Trains</button>

    </form>

</div>

</body>
</html>
