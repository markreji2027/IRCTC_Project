<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #1e293b;
            border-radius: 16px;
            padding: 48px 40px;
            width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            text-align: center;
        }
        .logo {
            font-size: 42px;
            margin-bottom: 12px;
        }
        h1 {
            color: white;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 36px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1.5px solid #334155;
            border-radius: 8px;
            font-size: 15px;
            color: white;
            outline: none;
            transition: border 0.2s;
        }
        .form-group input:focus { border-color: #3b82f6; }
        .error {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #f87171;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 18px;
        }
        .btn-login {
            width: 100%;
            padding: 13px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 16px;
        }
        .btn-login:hover { background: #2563eb; }
        .btn-back {
            display: block;
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s;
        }
        .btn-back:hover { color: #94a3b8; }
    </style>
</head>
<body>
<div class="login-box">
    <div class="logo">🚂</div>
    <h1>IRCTC Admin</h1>
    <p class="subtitle">Sign in to access the admin panel</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/admin/login">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username"
                   placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
    </form>
    <a href="/" class="btn-back">← Back to Customer Site</a>
</div>
</body>
</html>
