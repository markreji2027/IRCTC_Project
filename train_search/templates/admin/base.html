<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRCTC Admin — {% block title %}{% endblock %}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0;
            z-index: 100;
        }
        .sidebar-logo {
            padding: 28px 24px 20px;
            border-bottom: 1px solid #1e293b;
        }
        .sidebar-logo .icon { font-size: 28px; }
        .sidebar-logo h2 {
            color: white;
            font-size: 16px;
            font-weight: 700;
            margin-top: 6px;
        }
        .sidebar-logo p {
            color: #64748b;
            font-size: 11px;
            margin-top: 2px;
        }
        .sidebar-nav {
            flex: 1;
            padding: 16px 0;
        }
        .nav-label {
            color: #475569;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 24px 4px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 24px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .nav-item:hover {
            background: #1e293b;
            color: white;
        }
        .nav-item.active {
            background: #1e293b;
            color: #3b82f6;
            border-left-color: #3b82f6;
        }
        .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid #1e293b;
        }
        .btn-logout {
            display: block;
            width: 100%;
            padding: 10px;
            background: rgba(239,68,68,0.15);
            color: #f87171;
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            margin-bottom: 10px;
        }
        .btn-logout:hover {
            background: rgba(239,68,68,0.25);
            color: #fca5a5;
        }
        .btn-customer {
            display: block;
            width: 100%;
            padding: 10px;
            background: rgba(59,130,246,0.15);
            color: #60a5fa;
            border: 1px solid rgba(59,130,246,0.2);
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-customer:hover {
            background: rgba(59,130,246,0.25);
            color: #93c5fd;
        }

        /* ── MAIN CONTENT ── */
        .main {
            margin-left: 240px;
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            background: white;
            padding: 16px 32px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topbar h1 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }
        .topbar .admin-badge {
            background: #eff6ff;
            color: #3b82f6;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .content {
            padding: 28px 32px;
            flex: 1;
        }

        /* ── SHARED COMPONENTS ── */
        .cards-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px 22px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            border-top: 3px solid #3b82f6;
        }
        .stat-card.green  { border-top-color: #22c55e; }
        .stat-card.orange { border-top-color: #f97316; }
        .stat-card.purple { border-top-color: #a855f7; }
        .stat-card .label {
            font-size: 11px; color: #94a3b8;
            font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 26px; font-weight: 700; color: #0f172a;
        }
        .stat-card .sub { font-size: 11px; color: #cbd5e1; margin-top: 4px; }

        .charts-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 20px 22px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .chart-card h3 {
            font-size: 13px; font-weight: 700;
            color: #475569; margin-bottom: 16px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .chart-wrap { position: relative; height: 200px; }

        .table-card {
            background: white;
            border-radius: 12px;
            padding: 22px 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .table-card h3 {
            font-size: 13px; font-weight: 700;
            color: #475569; margin-bottom: 16px;
            text-transform: uppercase; letter-spacing: 0.5px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f1f5f9;
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead tr { background: #f8fafc; }
        thead th {
            padding: 10px 14px; text-align: left;
            font-weight: 700; color: #475569;
            font-size: 11px; text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e2e8f0;
        }
        tbody tr { border-bottom: 1px solid #f1f5f9; transition: background 0.1s; }
        tbody tr:hover { background: #f8fafc; }
        tbody td { padding: 12px 14px; color: #334155; }

        .badge {
            display: inline-block; padding: 3px 10px;
            border-radius: 20px; font-size: 11px; font-weight: 600;
        }
        .badge-express     { background: #eff6ff; color: #3b82f6; }
        .badge-superfast   { background: #f0fdf4; color: #22c55e; }
        .badge-rajdhani    { background: #fff7ed; color: #f97316; }
        .badge-duronto     { background: #fff1f2; color: #f43f5e; }
        .badge-shatabdi    { background: #faf5ff; color: #a855f7; }
        .badge-vandebharat { background: #ecfeff; color: #06b6d4; }

        .revenue { font-weight: 700; color: #22c55e; }
        .no-data {
            text-align: center; padding: 40px;
            color: #cbd5e1; font-size: 14px;
        }
        .pill {
            display: inline-block; padding: 3px 10px;
            border-radius: 20px; font-size: 11px; font-weight: 600;
            background: #eff6ff; color: #3b82f6;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-logo">
        <div class="icon">🚂</div>
        <h2>IRCTC Admin</h2>
        <p>Management Panel</p>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-label">Main</div>
        <a href="/admin/dashboard" class="nav-item {% if active == 'dashboard' %}active{% endif %}">
            <span class="icon">📊</span> Dashboard
        </a>
        <div class="nav-label">Data</div>
        <a href="/admin/bookings" class="nav-item {% if active == 'bookings' %}active{% endif %}">
            <span class="icon">🎟️</span> Bookings
        </a>
        <a href="/admin/trains" class="nav-item {% if active == 'trains' %}active{% endif %}">
            <span class="icon">🚆</span> Trains
        </a>
        <a href="/admin/routes" class="nav-item {% if active == 'routes' %}active{% endif %}">
            <span class="icon">🗺️</span> Routes
        </a>
    </nav>
    <div class="sidebar-footer">
        <a href="/admin/logout" class="btn-logout">Sign Out</a>
        <a href="/" class="btn-customer">Customer Site</a>
    </div>
</div>

<!-- Main content -->
<div class="main">
    <div class="topbar">
        <h1>{% block page_title %}{% endblock %}</h1>
        <span class="admin-badge">Admin</span>
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</div>

</body>
</html>
